<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact Us</title>
  <link rel="stylesheet" href="contact.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <nav class="navbar">
  <div class="nav-left">
    <img src="logoavif.avif" alt="logo">
    <h2>Appointment Scheduling App</h2>
  </div>

  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="#" id="navAppointments">Appointments</a></li>
    <li><a href="contact.html" class="active">Contact Us</a></li>
    <li><a href="#" id="logoutBtn">Logout</a></li>
  </ul>
</nav>


<div class="contact-container">

  <h1>Contact Us</h1>
  <p class="subtitle">We’d love to hear from you! Fill out the form below.</p>

  <form class="contact-form">

    <div class="input-box">
      <input type="text" required />
      <label>Your Name</label>
    </div>

    <div class="input-box">
      <input type="email" required />
      <label>Email Address</label>
    </div>

    <div class="input-box">
      <textarea required></textarea>
      <label>Your Message</label>
    </div>

    <button type="submit" class="contact-btn">Send Message</button>
  </form>

</div>
<script>
  // LOGOUT
  document.getElementById("logoutBtn").addEventListener("click", (e) => {
    e.preventDefault();
    localStorage.removeItem("user");
    window.location.href = "login.html";
  });

  // ✨ FUNCTION TO SHOW CUSTOM TOAST
  function showToast(message) {
    const container = document.getElementById("toastContainer");
    
    const toast = document.createElement("div");
    toast.className = "toast";
    toast.innerText = message;

    container.appendChild(toast);

    // Remove after animation ends
    setTimeout(() => {
      toast.remove();
    }, 3000);
  }

  // CONTACT FORM SUBMIT
  document.querySelector(".contact-form").addEventListener("submit", function (e) {
    e.preventDefault();  
    showToast("Your message has been sent successfully! 🌸");
    this.reset();    
  });
</script>

<div id="toastContainer"></div>


</body>
</html>
